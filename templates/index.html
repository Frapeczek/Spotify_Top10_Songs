<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Songs</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
       <header>
        <a href="home.html"><img src="../static/img/spotify_logo.png" alt="" id="spotify-logo"></a>
        <form id="search-form" method="POST" action="/">
            <input type="text" id="artist-name" name="artist_name" placeholder="Search for an artist...">
            <button type="submit">Search</button>
        </form>
    </header>
    <h1>Top 10 Songs</h1>
    <div id="loading">Loading...</div>
    <ul>
        {% for song in songs %}
        <li>
            <img src="{{ song['album']['images'][0]['url'] }}" alt="Album cover" style="width:100px;">
            <span>{{ song['name'] }}</span>
        </li>
        {% endfor %}
    </ul>
    <script src="/static/js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Top Songs</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/favourite.css">
    <link href='https://unpkg.com/css.gg@2.0.0/icons/css/bookmark.css' rel='stylesheet'>
</head>
<body>
<header>
    <div class="header-container">
        <a href="/" id="home-link">
            <img src="../static/img/spotify_logo.png" alt="Spotify Logo" id="spotify-logo">
        </a>
        <form id="search-form" method="POST" action="/">
            <input type="text" id="artist-name" name="artist_name" placeholder="Search for an artist...">
            <button type="submit">Search</button>
        </form>
        <button id="nav-toggler" aria-label="Toggle navigation">&#9776;</button>

    </div>
    <nav id="nav-menu">
        <div class="favorites-dropdown">
            <button id="favorites-toggler">Favorites</button>
            <ul id="favorites-list" class="favorites-list"></ul>
        </div>
        <a href="/form.html">Contact</a>
    </nav>
</header>

<div class="artist-banner">
    <img src="{{ banner_image }}" class="artist-photo" alt="Artist photo">
    <span class="artist-name">{{ artist_name }}</span>
    <button class="btn btn-primary" id="add-to-favorites" data-artist="{{ artist_name }}" title = "Add to your favourites"> <i class="gg-bookmark"></i>
    </button>
</div>

<div class="container">
    <ul class="list-unstyled text-center">
        {% for song in songs %}
        <li class="mb-4">
            <div class="song-info">
                <img src="{{ song['album']['images'][0]['url'] }}" class="music_photo" alt="Album cover"
                     style="width:100px;">
                <div>
                    <span class="music_name custom-styles">{{ song['name'] }}</span>
                    <span class="popularity custom-styles {% if song['popularity'] > 85 %}high{% elif song['popularity'] > 60 %}medium{% else %}low{% endif %}">
                        {{ song['popularity'] }}%
                    </span>
                </div>
            </div>

            <a href="{{ song['external_urls']['spotify'] }}" target="_blank" class="spotify-link">
                <img src="../static/img/spotify_logo.png" alt="Spotify link" class="spotify-logo">
            </a>
        </li>
        {% endfor %}
    </ul>
</div>

<footer>
    <p>&copy; 2021 Spotify Top Songs</p>
</footer>

<script src="../static/js/script.js"></script>
</body>
</html>

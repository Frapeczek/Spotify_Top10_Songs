<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Top Songs</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img class="d-block w-100" src="/static/img/spotify_slide2.jpeg" alt="First slide">
                <div class="carousel-caption d-none d-md-block">
                    <h1>Spotify Top Songs</h1>
                    <p>Search for your favorite artist above.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="/static/img/slide_theweeknd.jpeg" alt="Second slide">
                <div class="carousel-caption d-none d-md-block">
                    <h1>Spotify Top Songs</h1>
                    <p>Search for your favorite artist above.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="/static/img/spotify_slide.jpg" alt="Third slide">
                <div class="carousel-caption d-none d-md-block">
                    <h1>Spotify Top Songs</h1>
                    <p>Search for your favorite artist above.</p>
                </div>
            </div>
        </div>
    </div>

    <header>
        <a href="home.html"><img src="../static/img/spotify_logo.png" alt="" id="spotify-logo"></a>
        <form id="search-form" method="POST" action="/">
            <input type="text" id="artist-name" name="artist_name" placeholder="Search for an artist...">
            <button type="submit">Search</button>
        </form>
    </header>


    <!-- jQuery, Popper.js, and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
